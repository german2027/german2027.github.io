<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

</head>

<body>
  
    <div class="container">

<div class="classSelector">
  <label for="schoolClass">
    Wählen Sie die Klasse des Schülers aus:
  </label>

  <select id="schoolClass">
    <option value="1">Klasse 1</option>
    <option value="2">Klasse 2</option>
    <option value="3">Klasse 3</option>
    <option value="4">Klasse 4</option>
    <option value="5" selected>Klasse 5</option>
    <option value="6">Klasse 6</option>
    <option value="7">Klasse 7</option>
    <option value="8">Klasse 8</option>
    <option value="9">Klasse 9</option>
    <option value="10">Klasse 10</option>
    <option value="11">Klasse 11</option>
    <option value="12">Klasse 12</option>
  </select>
</div>
        
        Wir lernen Deutsch!
        <div class=" spacer"></div>
        <textarea id="textInput" placeholder="Hier sehen Sie den von Ihnen gesprochenen Text"></textarea>
        <div class=" spacer"></div>
        <button id="sendButton" onclick="speech()">Möchten Sie etwas sagen? Klicken Sie hier – und reden Sie</button>
        <div class=" spacer"></div>
        <textarea id="textOutput" placeholder="Hier sehen Sie die Antwort der Künstlichen Intelligenz (KI)"></textarea>
        <div class=" spacer"></div>
        <button onclick="talk(outp.value)">Möchten Sie sich die von der KI ausgesprochene Antwort noch einmal anhören – klicken Sie hier</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</body>
</html>
